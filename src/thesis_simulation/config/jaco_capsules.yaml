capsule_visualizer:
  ros__parameters:
    reference_frame: world
    publish_rate_hz: 20.0
    marker_topic: /thesis/robot_capsules

    # Each row describes one capsule between two TF frame origins.
    # Radii are initial conservative approximations and can be calibrated
    # later against measurements of the physical JACO2.
    segment_names:
      - base_to_shoulder
      - shoulder_to_upper_arm
      - upper_arm_to_forearm
      - forearm_to_wrist_1
      - wrist_1_to_wrist_2
      - wrist_2_to_tool
    segment_start_frames:
      - j2n6s300_link_base
      - j2n6s300_link_1
      - j2n6s300_link_2
      - j2n6s300_link_3
      - j2n6s300_link_4
      - j2n6s300_link_5
    segment_end_frames:
      - j2n6s300_link_1
      - j2n6s300_link_2
      - j2n6s300_link_3
      - j2n6s300_link_4
      - j2n6s300_link_5
      - j2n6s300_end_effector
    segment_radii:
      - 0.105
      - 0.095
      - 0.085
      - 0.075
      - 0.070
      - 0.090

    color_rgba: [0.05, 0.80, 0.35, 0.38]
