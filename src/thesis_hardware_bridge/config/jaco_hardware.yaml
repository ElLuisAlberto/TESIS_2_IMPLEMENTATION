jaco_hardware_adapter:
  ros__parameters:
    use_sim_time: false
    mock_hardware: false
    hardware_output_enabled: false
    expected_serial_number: ""
    usb_lock_file: "/tmp/thesis_kinova_jaco2_usb.lock"
    state_publish_rate_hz: 20.0
    control_rate_hz: 100.0
    state_timeout_sec: 0.20
    jog_command_timeout_sec: 0.18
    max_jog_message_age_sec: 0.15
    execution_control_timeout_sec: 0.35
    goal_tolerance_rad: 0.005
    position_tracking_gain: 4.0
    goal_timeout_factor: 4.0
    goal_timeout_margin_sec: 2.0
    maximum_read_failures: 3
    initialization_read_attempts: 10
    initialization_retry_delay_ms: 200
    zero_command_count: 10
