obstacle_demo_source:
  ros__parameters:
    # One raw sphere; the bridge adds uncertainty to the effective radius.
    frame_id: world
    radius: 0.10
    uncertainty: 0.02
    rate_hz: 10.0
    scenario: PARK
    insert_stop_active: false

    # Reference state measured from the physical JACO2 on 2026-10-20:
    # [2.2334760271614935, 2.483514895586853, 1.0155264405650484,
    #  5.740923098662012, 5.969486236056973, 2.079310957978987]
    # PARK is the first +X 0.01 m grid pose with at least 0.80 m current
    # clearance and at least 0.775 m projected clearance for J1 +/-3 deg.
    # STOP poses are derived on wrist_2_to_tool with an
    # effective sphere radius of 0.12 m and a positive surface clearance
    # target equal to 30% of the configured 0.05 m STOP distance.
    park_pose: [1.22, 0.0, 0.60]
    block_start_pose:
      [0.017715572026672233, 0.24629707151187663, 0.5423259709067948]
    insert_stop_pose:
      [0.23442858697668922, -0.12962618026812636, 0.6773259709067948]
